<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uni-Bean 12.0｜公告審核與爬蟲紀錄</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color-scheme:light}body{margin:0;background:#f5f7f8;color:#1e2932}header{background:white;border-bottom:1px solid #e4e8ec;padding:16px max(18px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px}h1{font-size:1.28rem;margin:0}header a{color:#276a7d;text-decoration:none}main{max-width:1100px;padding:24px 18px;margin:auto}p{line-height:1.6}.muted{color:#576875;font-size:.9rem}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:18px 0}select,button{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid #cfd9df;background:#fff;cursor:pointer}button:hover{background:#eff5f6}button:disabled{opacity:.6;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{background:#fff;padding:16px;border:1px solid #e1e5e8;border-radius:14px}.card h3{margin-top:0;line-height:1.4}.card small{display:block;color:#5d6b75;margin:7px 0}.card a{word-break:break-all;color:#276a7d}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}#message{white-space:pre-wrap}.audit{font-family:ui-monospace,monospace;font-size:.85rem;overflow-wrap:anywhere}section{margin-top:30px}@media(max-width:600px){header{align-items:start;flex-direction:column}}
</style><script defer src="./js/v12-admin.js"></script></head>
<body><header><div><h1>Uni-Bean v12.0｜資料審核中心</h1><div class="muted">公告來源與核實狀態管理</div></div><nav><a href="./staff.html">原管理端</a>　<a href="./dev.html">開發者端</a>　<a href="./">返回使用者端</a></nav></header>
<main><p class="muted">「官方來源擷取」只代表來源網址經檢查，不能當作規章內容已核實。核准公告不會自動核准整份規章。</p>
<p id="message" role="status" aria-live="polite">正在確認管理端權限…</p>
<section><h2>公告候選資料</h2><div class="toolbar"><label for="filter">審核狀態</label><select id="filter"><option value="source_checked">來源已檢查（待內容核實）</option><option value="pending">待確認</option><option value="approved">已核准</option><option value="hidden">已隱藏</option><option value="all">全部</option></select><button type="button" id="refresh">重新整理</button></div><div class="cards" id="candidates"></div></section>
<section id="dev-audit" hidden><h2>爬蟲執行紀錄（開發者）</h2><div id="runs" class="cards"></div></section></main></body></html>
